name: macOS build and DMG
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
      - name: Locked package and software correctness tests
        run: nix build path:. --no-link
      - name: Debug allocator and native lifecycle checks
        run: |
          nix develop path:. --command sh -c '
            zig build -Doptimize=ReleaseSafe -Ddebug-allocator=true --prefix zig-out-debug &&
            python3 scripts/stability.py --repeats 2 --cycles 256 --output dist/stability.json
          '
      - name: Build portable development DMG
        run: nix develop path:. --command zig build dmg -Doptimize=ReleaseFast -Dcpu=baseline
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Yekk-${{ runner.arch }}
          path: |
            dist/*.dmg
            dist/*.json
          if-no-files-found: error
