name: Linux build and desktop validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
      - name: Verify process supervision
        run: python3 scripts/supervisor-test.py
      - name: Locked production package and native decoder tests
        run: nix build path:. --no-link
      - name: Debug allocator and supervised desktop workflows
        run: |
          nix develop path:. --command sh -c '
            zig build -Doptimize=ReleaseSafe -Ddebug-allocator=true &&
            python3 scripts/linux-validation.py --video-driver dummy &&
            python3 scripts/linux-parity-test.py --video-driver dummy &&
            python3 scripts/linux-desktop-test.py --instant-click &&
            python3 scripts/linux-desktop-test.py --instant-click --dialog-driver portal --output dist/linux-desktop-portal.json &&
            python3 scripts/wayland-validation.py --parity &&
            python3 scripts/wayland-validation.py --parity --scale 2 --output dist/linux-wayland-scale2-parity.json &&
            python3 scripts/wayland-validation.py
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: Linux-validation-${{ runner.arch }}
          path: |
            dist/linux-validation.json
            dist/linux-parity.json
            dist/linux-desktop-integration.json
            dist/linux-desktop-portal.json
            dist/linux-wayland-*.json
          if-no-files-found: warn
